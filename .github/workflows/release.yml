name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # release oluşturmak + artefakt yüklemek için

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/portal-gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/portal-gui/src-tauri"
      - run: npm ci
        working-directory: crates/portal-gui
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/portal-gui
          tagName: ${{ github.ref_name }}
          releaseName: Portal ${{ github.ref_name }}
          releaseDraft: true          # taslak: hash'leri ve notu ekleyip sen yayınlarsın
          prerelease: false